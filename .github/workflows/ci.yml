name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  openspec:
    name: OpenSpec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.6.0 validate --all --strict --no-interactive

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://bookshelf:password@localhost:5432/bookshelf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo systemctl start postgresql.service
      - run: pg_isready
      - run: sudo -u postgres psql --command="CREATE USER bookshelf WITH SUPERUSER PASSWORD 'password'" --command="\du" postgres
      - run: sudo -u postgres createdb --owner=bookshelf bookshelf
      - run: cargo test --all-features --locked
      - name: Test release tag validation
        run: .github/scripts/test-validate-release-tag.sh

  test-image-building:
    name: Test Image Building
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Configure sccache GitHub Actions backend
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: usr-local-cargo-registry
          key: docker-rust-${{ hashFiles('Dockerfile') }}-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            docker-rust-${{ hashFiles('Dockerfile') }}-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('Cargo.lock') }}-
            docker-rust-${{ hashFiles('Dockerfile') }}-${{ hashFiles('**/Cargo.toml') }}-
            docker-rust-${{ hashFiles('Dockerfile') }}-
      - name: inject cache into docker
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "usr-local-cargo-registry": "/usr/local/cargo/registry"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: false
          load: true
          tags: bookshelf-api:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: SCCACHE_ENABLED=true
          secret-envs: |
            actions_results_url=ACTIONS_RESULTS_URL
            actions_runtime_token=ACTIONS_RUNTIME_TOKEN
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and pull main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image=ghcr.io/hiterm/bookshelf-api:main
          docker tag bookshelf-api:test "$image"
          docker push "$image"
          digest_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "TEST_IMAGE=$digest_ref" >> "$GITHUB_ENV"
          docker image rm bookshelf-api:test "$image"
          docker pull "$digest_ref"

      - name: Run container and health check
        run: |
          test_image=${TEST_IMAGE:-bookshelf-api:test}
          docker network create test-network

          docker run -d --name postgres --network test-network \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_USER=bookshelf \
            -e POSTGRES_DB=bookshelf \
            postgres:15

          # Wait for PostgreSQL to be ready
          for i in {1..30}; do
            if docker exec postgres pg_isready -U bookshelf; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

          docker run -d --name test-container --network test-network -p 8080:8080 \
            -e PORT=8080 \
            -e DATABASE_URL=postgres://bookshelf:password@postgres:5432/bookshelf \
            -e ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080 \
            -e RUST_LOG=debug \
            -e JWT_AUDIENCE=dummy \
            -e JWT_DOMAIN=dummy \
            "$test_image"

          for i in {1..20}; do
            if curl --fail http://localhost:8080/health 2>/dev/null; then
              echo "Health check passed after ${i} seconds"
              docker stop -t 1 test-container postgres
              docker network remove test-network
              exit 0
            fi
            sleep 1
          done

          echo "Health check failed after 20 seconds"
          echo "=== Container Logs ==="
          docker logs test-container
          docker stop -t 1 test-container postgres
          docker network remove test-network
          exit 1

      - name: Build tls-check image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: false
          load: true
          tags: bookshelf-api:tls-check
          target: tls-check
          cache-from: type=gha
      - name: Verify HTTPS connectivity via reqwest
        run: docker run --rm bookshelf-api:tls-check

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-toolchain
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings

  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo systemctl start postgresql.service
      - run: pg_isready
      - run: sudo -u postgres psql --command="CREATE USER bookshelf WITH SUPERUSER PASSWORD 'password'" postgres
      - run: sudo -u postgres createdb --owner=bookshelf bookshelf_migration_test_empty
      - run: sudo -u postgres createdb --owner=bookshelf bookshelf_migration_test_data
      - run: node migrations/test/test_migration.mjs
        env:
          MIGRATION_TEST_EMPTY_URL: postgres://bookshelf:password@localhost:5432/bookshelf_migration_test_empty
          MIGRATION_TEST_DATA_URL: postgres://bookshelf:password@localhost:5432/bookshelf_migration_test_data

  check-schema:
    name: Check Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Generate schema
        run: cargo run --bin gen_schema --locked > /tmp/schema.graphql.generated
      - name: Check schema is up to date
        run: diff schema.graphql /tmp/schema.graphql.generated
