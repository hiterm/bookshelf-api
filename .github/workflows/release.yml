name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  tagpr:
    name: Update release pull request or tag release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-toolchain
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-edit
      - name: Run tagpr
        id: tagpr
        uses: Songmu/tagpr@d1b8138b7a31075141b6cd64103de9485ced7ac9 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine release tag
        id: release_tag
        env:
          TAGPR_TAG: ${{ steps.tagpr.outputs.tag }}
        run: |
          tag="${TAGPR_TAG}"
          if [[ -z "${tag}" ]]; then
            git fetch --force --tags origin
            tag=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$' | sort -V | tail -n 1)
          fi

          if [[ -n "${tag}" ]]; then
            .github/scripts/validate-release-tag.sh "${tag}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy release
    if: ${{ needs.tagpr.outputs.release_tag != '' }}
    needs: tagpr
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      release_tag: ${{ needs.tagpr.outputs.release_tag }}
    # secrets-inherit: deploy.yml is repository-local and needs GITHUB_TOKEN plus
    # RENDER_DEPLOY_HOOK only for the trusted main release path.
    secrets: inherit # zizmor: ignore[secrets-inherit]
