name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # secrets-outside-env: this trusted main release job needs the GitHub App key
  # to create a token for release pull requests.
  tagpr: # zizmor: ignore[secrets-outside-env]
    name: Update release pull request or tag release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write
    outputs:
      release_tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-toolchain
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-edit
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOOKSHELF_DELIVERY_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOOKSHELF_DELIVERY_APP_PRIVATE_KEY }}
      - name: Run tagpr
        id: tagpr
        uses: Songmu/tagpr@e1250d6c84e4425db82b5e90549d62dfe23e9ebe # v1.21.4
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Determine release tag
        id: release_tag
        env:
          TAGPR_TAG: ${{ steps.tagpr.outputs.tag }}
        run: |
          tag="${TAGPR_TAG}"
          if [[ -z "${tag}" ]]; then
            git fetch --force --tags origin
            tag=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$' | sort -V | tail -n 1)
          fi

          if [[ -n "${tag}" ]]; then
            .github/scripts/validate-release-tag.sh "${tag}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy release
    if: ${{ needs.tagpr.outputs.release_tag != '' }}
    needs: tagpr
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      release_tag: ${{ needs.tagpr.outputs.release_tag }}
    # secrets-inherit: deploy.yml is repository-local and needs GITHUB_TOKEN plus
    # the GitHub App private key to notify the deployment repository.
    secrets: inherit # zizmor: ignore[secrets-inherit]
