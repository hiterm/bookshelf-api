type Author {
	id: ID!
	name: String!
	yomi: String!
	createdAt: DateTime!
	updatedAt: DateTime!
	books: [Book!]!
}

type AuthorEventEntry {
	eventId: ID!
	eventSetId: ID!
	operation: String!
	authorId: ID!
	name: String
	yomi: String
	authorCreatedAt: Int
	authorUpdatedAt: Int
	changedAt: Int!
	extra: JSON
}

type AuthorMutationPayload {
	author: Author!
	operationId: ID!
	revisionNumber: Int!
}

type AuthorOperationChange {
	authorId: ID!
	beforeRevision: AuthorRevision
	afterRevision: AuthorRevision
}

type AuthorRevision {
	authorId: ID!
	revisionNumber: Int!
	name: String!
	yomi: String!
	authorCreatedAt: DateTime!
	authorUpdatedAt: DateTime!
	createdAt: DateTime!
}

type Book {
	id: String!
	title: String!
	isbn: String!
	read: Boolean!
	owned: Boolean!
	priority: Int!
	format: BookFormat!
	store: BookStore!
	createdAt: Int!
	updatedAt: Int!
	authors: [Author!]!
}

type BookEventEntry {
	eventId: ID!
	eventSetId: ID!
	operation: String!
	bookId: ID!
	title: String
	authorIds: [ID!]!
	isbn: String
	read: Boolean
	owned: Boolean
	priority: Int
	format: BookFormat
	store: BookStore
	bookCreatedAt: Int
	bookUpdatedAt: Int
	changedAt: Int!
	extra: JSON
}

enum BookFormat {
	E_BOOK
	PRINTED
	UNKNOWN
}

type BookMutationPayload {
	book: Book!
	operationId: ID!
	revisionNumber: Int!
}

type BookOperationChange {
	bookId: ID!
	beforeRevision: BookRevision
	afterRevision: BookRevision
}

type BookRevision {
	bookId: ID!
	revisionNumber: Int!
	title: String!
	authorIds: [ID!]!
	isbn: String!
	read: Boolean!
	owned: Boolean!
	priority: Int!
	format: BookFormat!
	store: BookStore!
	bookCreatedAt: DateTime!
	bookUpdatedAt: DateTime!
	createdAt: DateTime!
}

enum BookStore {
	KINDLE
	UNKNOWN
}

input CreateAuthorInput {
	name: String!
	yomi: String
}

input CreateBookInput {
	title: String!
	authorIds: [String!]!
	isbn: String!
	read: Boolean!
	owned: Boolean!
	priority: Int!
	format: BookFormat!
	store: BookStore!
}

"""
A datetime with timezone offset.

The input is a string in RFC3339 format, e.g. "2022-01-12T04:00:19.12345Z"
or "2022-01-12T04:00:19+03:00". The output is also a string in RFC3339
format, but it is always normalized to the UTC (Z) offset, e.g.
"2022-01-12T04:00:19.12345Z".
"""
scalar DateTime

type DeleteAuthorPayload {
	authorId: ID!
	operationId: ID!
}

type DeleteBookPayload {
	bookId: ID!
	operationId: ID!
}

type EventSet {
	id: ID!
	operation: String!
	createdAt: Int!
	bookEvents: [BookEventEntry!]!
	authorEvents: [AuthorEventEntry!]!
}

type ImportAuthorPreview {
	name: String!
	status: ImportAuthorStatus!
}

enum ImportAuthorStatus {
	EXISTING
	NEW
}

input ImportBookInput {
	"""
	Title of the book.
	"""
	title: String!
	"""
	Names of the authors. Authors will be created if they do not exist.
	"""
	authorNames: [String!]!
	"""
	ISBN of the book.
	"""
	isbn: String!
	"""
	Whether the book has been read.
	"""
	read: Boolean!
	"""
	Whether the book is owned.
	"""
	owned: Boolean!
	"""
	Priority value ranging from 0 to 100.
	"""
	priority: Int!
	"""
	Format of the book.
	"""
	format: BookFormat!
	"""
	Store where the book was purchased or obtained.
	"""
	store: BookStore!
}

type ImportBookPreview {
	title: String!
	authors: [ImportAuthorPreview!]!
	isbn: String!
	read: Boolean!
	owned: Boolean!
	priority: Int!
	format: BookFormat!
	store: BookStore!
}

type ImportBooksPayload {
	books: [Book!]!
	operationId: ID!
}

type ImportBooksPreview {
	books: [ImportBookPreview!]!
}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

type MergeAuthorPayload {
	author: Author!
	operationId: ID!
}

type Mutation {
	registerUser: User!
	createBook(bookData: CreateBookInput!): BookMutationPayload!
	updateBook(bookData: UpdateBookInput!): BookMutationPayload!
	deleteBook(bookId: ID!): DeleteBookPayload!
	createAuthor(authorData: CreateAuthorInput!): AuthorMutationPayload!
	updateAuthor(authorData: UpdateAuthorInput!): AuthorMutationPayload!
	deleteAuthor(authorId: ID!): DeleteAuthorPayload!
	mergeAuthor(sourceAuthorId: ID!, destinationAuthorId: ID!): MergeAuthorPayload!
	restoreBook(bookId: ID!, revisionNumber: Int!): RestoreBookPayload!
	restoreAuthor(authorId: ID!, revisionNumber: Int!): RestoreAuthorPayload!
	"""
	Imports multiple books. Creates authors if they do not exist.
	"""
	importBooks(books: [ImportBookInput!]!): ImportBooksPayload!
	"""
	Executes the book import path and rolls the complete transaction back.
	"""
	previewBookImport(books: [ImportBookInput!]!): ImportBooksPreview!
}

type Operation {
	id: ID!
	type: String!
	detail: JSON
	undoOfOperationId: ID
	createdAt: DateTime!
	bookChanges: [BookOperationChange!]!
	authorChanges: [AuthorOperationChange!]!
}

type Query {
	operations: [Operation!]!
	operation(id: ID!): Operation
	bookRevisions(bookId: ID!): [BookRevision!]!
	bookRevision(bookId: ID!, revisionNumber: Int!): BookRevision
	authorRevisions(authorId: ID!): [AuthorRevision!]!
	authorRevision(authorId: ID!, revisionNumber: Int!): AuthorRevision
	loggedInUser: User
	book(id: ID!): Book
	books: [Book!]!
	author(id: ID!): Author
	authors: [Author!]!
	"""
	Returns the change history for a book.
	Entries are sorted by `changedAt` in descending order (newest first).
	"""
	bookEvents(bookId: ID!): [BookEventEntry!]!
	"""
	Returns the change history for an author.
	Entries are sorted by `changedAt` in descending order (newest first).
	"""
	authorEvents(authorId: ID!): [AuthorEventEntry!]!
	"""
	Returns the logged-in user's event sets, newest first.
	"""
	eventSets: [EventSet!]!
	"""
	Returns a single event set with nested events, or null if not found.
	"""
	eventSet(id: ID!): EventSet
}

type RestoreAuthorPayload {
	author: Author
	operationId: ID!
	revisionNumber: Int!
}

type RestoreBookPayload {
	book: Book
	operationId: ID!
	revisionNumber: Int!
}

input UpdateAuthorInput {
	id: ID!
	name: String!
	yomi: String
}

input UpdateBookInput {
	id: String!
	title: String!
	authorIds: [String!]!
	isbn: String!
	read: Boolean!
	owned: Boolean!
	priority: Int!
	format: BookFormat!
	store: BookStore!
}

type User {
	id: ID!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: Query
	mutation: Mutation
}

